<!doctype html>

    <style>

      <svg viewBox="0 0 24 24" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <h1>ออฟไลน์อยู่</h1>
      <p>ยังไม่เคยเปิดแอปนี้ตอนมีอินเทอร์เน็ตบนเครื่องนี้ จึงยังไม่มีข้อมูลเก็บไว้ — เชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่</p>
