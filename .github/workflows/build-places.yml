name: Build Place Seed

# Run manually AFTER "Build Geo Data": Actions -> Build Place Seed -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Geocode with OpenStreetMap Nominatim (1 req/sec)
        run: node scripts/build-places.mjs
      - name: Show report
        run: cat data/seed/places-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/seed_places.sql data/seed/places-report.md
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "chore: build demo place seed from OSM"
            git push
          fi
